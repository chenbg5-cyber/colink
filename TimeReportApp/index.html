<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>דיווח שעות</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card-hover: #222240;
  --accent: #6c63ff;
  --accent-light: #8b83ff;
  --accent-glow: rgba(108, 99, 255, 0.15);
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --success: #4ecdc4;
  --danger: #ff6b6b;
  --warning: #ffd93d;
  --border: #2a2a45;
  --input-bg: #12122a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

.app-header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
}

.app-header h1 {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  background: linear-gradient(135deg, var(--accent-light), var(--success));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tab-bar {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  background: var(--input-bg);
  border-radius: 12px;
  padding: 4px;
}

.tab-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
}

.tab-btn.active {
  background: var(--accent);
  color: white;
  box-shadow: 0 2px 12px rgba(108, 99, 255, 0.4);
}

.container {
  padding: 16px;
  max-width: 500px;
  margin: 0 auto;
  padding-bottom: 40px;
}

/* Month Navigation */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 16px;
  background: var(--card);
  border-radius: 16px;
  padding: 14px 16px;
  border: 1px solid var(--border);
}

.month-nav button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.month-nav button:active {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(0.92);
}

.month-nav .month-display {
  text-align: center;
  min-width: 140px;
  font-size: 18px;
  font-weight: 700;
}

/* Day Cards */
.days-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.day-card {
  background: var(--card);
  border-radius: 14px;
  border: 1px solid var(--border);
  overflow: hidden;
  transition: all 0.2s;
}

.day-card.weekend {
  opacity: 0.5;
}

.day-card.weekend.has-data {
  opacity: 1;
}

.day-card.today {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.2s;
}

.day-header:active {
  background: var(--card-hover);
}

.day-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.day-name {
  font-size: 15px;
  font-weight: 600;
}

.day-date {
  font-size: 12px;
  color: var(--text-dim);
}

.day-header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.day-total {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-light);
}

.day-total small {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.7;
}

.day-total.empty {
  color: var(--text-dim);
  font-weight: 400;
  font-size: 13px;
}

.day-tags {
  display: flex;
  gap: 4px;
}

.tag {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
}

.tag-home {
  background: rgba(78, 205, 196, 0.15);
  color: var(--success);
}

.tag-travel {
  background: rgba(255, 217, 61, 0.15);
  color: var(--warning);
}

.expand-icon {
  color: var(--text-dim);
  font-size: 12px;
  transition: transform 0.2s;
}

.day-card.open .expand-icon {
  transform: rotate(90deg);
}

/* Day Expanded Content */
.day-content {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px solid var(--border);
}

.day-card.open .day-content {
  display: block;
}

.time-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.time-input-wrap {
  flex: 1;
}

.time-input-wrap span {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.time-input-wrap input[type="time"] {
  width: 100%;
  padding: 10px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  text-align: center;
  outline: none;
  -webkit-appearance: none;
}

.time-input-wrap input[type="time"]:focus {
  border-color: var(--accent);
}

.save-entry-btn {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  box-shadow: 0 3px 12px rgba(108, 99, 255, 0.3);
}

.save-entry-btn:active {
  transform: scale(0.97);
}

.edit-day-btn {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
}

.edit-day-btn:active {
  background: var(--card-hover);
  color: var(--text);
}

.entries-in-day {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.entry-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--input-bg);
  border-radius: 8px;
  padding: 8px 12px;
  border: 1px solid var(--border);
}

.entry-times {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: 8px;
}

.entry-times .arrow {
  color: var(--accent);
  font-size: 12px;
}

.entry-hours {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-light);
}

.entry-del {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: rgba(255, 107, 107, 0.1);
  color: var(--danger);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.toggles-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.toggle-pill {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--input-bg);
  border-radius: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  cursor: pointer;
}

.toggle-pill .pill-text {
  font-size: 13px;
  color: var(--text);
}

.toggle-mini {
  position: relative;
  width: 40px;
  height: 22px;
}

.toggle-mini input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-mini .slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--border);
  border-radius: 22px;
  transition: 0.3s;
}

.toggle-mini .slider:before {
  content: '';
  position: absolute;
  height: 16px;
  width: 16px;
  right: 3px;
  bottom: 3px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: 0.3s;
}

.toggle-mini input:checked + .slider {
  background: var(--accent);
}

.toggle-mini input:checked + .slider:before {
  transform: translateX(-18px);
  background: white;
}

/* Dashboard */
.dash-section {
  margin-bottom: 20px;
}

.dash-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat-box {
  background: var(--card);
  border-radius: 14px;
  padding: 18px 14px;
  text-align: center;
  border: 1px solid var(--border);
}

.stat-box.wide {
  grid-column: 1 / -1;
}

.stat-box.accent {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--card), rgba(108, 99, 255, 0.08));
}

.stat-val {
  font-size: 30px;
  font-weight: 800;
  color: var(--accent-light);
}

.stat-lbl {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
}

.progress-bar-wrap {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  border: 1px solid var(--border);
  margin-bottom: 10px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 8px;
}

.progress-label span:first-child { color: var(--text); font-weight: 600; }
.progress-label span:last-child { color: var(--text-dim); }

.progress-track {
  height: 8px;
  background: var(--input-bg);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width 0.5s ease;
}

.progress-fill.green { background: linear-gradient(90deg, #2ecc71, var(--success)); }
.progress-fill.yellow { background: linear-gradient(90deg, #f39c12, var(--warning)); }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--card);
  border: 1px solid var(--accent);
  color: var(--text);
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  z-index: 1000;
  transition: transform 0.3s ease;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

.version {
  text-align: center;
  padding: 20px;
  color: var(--text-dim);
  font-size: 11px;
  opacity: 0.5;
}
</style>
</head>
<body>

<header class="app-header">
  <h1>דיווח שעות</h1>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('report')">דיווח</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">דשבורד</button>
  </div>
</header>

<div class="container">
  <!-- Report View -->
  <div id="reportView">
    <div class="month-nav">
      <button onclick="changeMonth(1)">&#8250;</button>
      <div class="month-display" id="monthDisplay"></div>
      <button onclick="changeMonth(-1)">&#8249;</button>
    </div>
    <div id="daysList" class="days-list"></div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboardView" style="display:none;">
    <div class="month-nav">
      <button onclick="changeDashMonth(1)">&#8250;</button>
      <div class="month-display" id="dashMonthDisplay"></div>
      <button onclick="changeDashMonth(-1)">&#8249;</button>
    </div>
    <div id="dashContent"></div>
  </div>

  <div class="version">דיווח שעות v2.0</div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'timeReportData';
const DAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

let currentMonth = new Date();
let dashMonth = new Date();
let openDay = null;
let editingDay = null;
let data = loadData();

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function getDayData(key) {
  if (!data[key]) data[key] = { entries: [], travel: false, home: false };
  if (!data[key].entries) data[key].entries = [];
  return data[key];
}

function calcHours(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if (diff < 0) diff += 24 * 60;
  return diff / 60;
}

function fmtH(totalHours) {
  if (totalHours === 0) return '0';
  const h = Math.floor(totalHours);
  const m = Math.round((totalHours - h) * 60);
  if (m === 0) return `${h}`;
  return `${h}:${String(m).padStart(2,'0')}`;
}

function fmtHLabel(totalHours) {
  if (totalHours === 0) return '0 שעות';
  const h = Math.floor(totalHours);
  const m = Math.round((totalHours - h) * 60);
  if (m === 0) return `${h} שעות`;
  return `${h}:${String(m).padStart(2,'0')} שעות`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (tab === 'report' && i === 0) || (tab === 'dashboard' && i === 1));
  });
  document.getElementById('reportView').style.display = tab === 'report' ? 'block' : 'none';
  document.getElementById('dashboardView').style.display = tab === 'dashboard' ? 'block' : 'none';
  if (tab === 'dashboard') renderDashboard();
}

function changeMonth(dir) {
  currentMonth.setMonth(currentMonth.getMonth() + dir);
  renderReport();
}

function changeDashMonth(dir) {
  dashMonth.setMonth(dashMonth.getMonth() + dir);
  renderDashboard();
}

function toggleDay(key) {
  if (openDay !== key) editingDay = null;
  openDay = openDay === key ? null : key;
  renderReport();
  if (openDay) {
    setTimeout(() => {
      const el = document.getElementById('day-' + key);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

function editDay(key) {
  editingDay = key;
  openDay = key;
  renderReport();
  setTimeout(() => {
    const el = document.getElementById('day-' + key);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function addEntry(key) {
  const startEl = document.getElementById('start-' + key);
  const endEl = document.getElementById('end-' + key);
  if (!startEl || !endEl) return;
  const start = startEl.value;
  const end = endEl.value;
  if (!start || !end) { showToast('יש למלא שעת התחלה וסיום'); return; }
  if (start >= end) { showToast('שעת הסיום חייבת להיות אחרי ההתחלה'); return; }
  const dayData = getDayData(key);
  dayData.entries.push({ start, end, id: Date.now() });
  dayData.entries.sort((a,b) => a.start.localeCompare(b.start));
  saveData();
  editingDay = null;
  openDay = key;
  renderReport();
  showToast('רשומה נוספה');
}

function deleteEntry(key, id) {
  const dayData = getDayData(key);
  dayData.entries = dayData.entries.filter(e => e.id !== id);
  saveData();
  renderReport();
  openDay = key;
  renderReport();
  showToast('רשומה נמחקה');
}

function saveToggle(key, field) {
  const el = document.getElementById(field + '-' + key);
  if (!el) return;
  const dayData = getDayData(key);
  dayData[field] = el.checked;
  saveData();
  renderReport();
  openDay = key;
  renderReport();
}

function renderReport() {
  const m = currentMonth.getMonth();
  const y = currentMonth.getFullYear();
  document.getElementById('monthDisplay').textContent = MONTHS_HE[m] + ' ' + y;

  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  const daysInMonth = new Date(y, m+1, 0).getDate();

  let html = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(y, m, d);
    const dow = dt.getDay();
    const key = dateKey(y, m, d);
    const dayData = data[key] || { entries: [], travel: false, home: false };
    const entries = dayData.entries || [];
    const totalH = entries.reduce((s, e) => s + calcHours(e.start, e.end), 0);
    const isToday = key === todayKey;
    const isWeekend = dow === 5 || dow === 6;
    const hasData = entries.length > 0;
    const isOpen = openDay === key;

    let cls = 'day-card';
    if (isToday) cls += ' today';
    if (isWeekend) cls += ' weekend';
    if (hasData) cls += ' has-data';
    if (isOpen) cls += ' open';

    let tags = '';
    if (dayData.home) tags += '<span class="tag tag-home">בית</span>';
    if (dayData.travel) tags += '<span class="tag tag-travel">נסיעה</span>';

    html += `<div class="${cls}" id="day-${key}">
      <div class="day-header" onclick="toggleDay('${key}')">
        <div class="day-header-right">
          <span class="expand-icon">&#8250;</span>
          <div>
            <div class="day-name">יום ${DAYS_HE[dow]}, ${d}</div>
          </div>
        </div>
        <div class="day-header-left">
          <div class="day-tags">${tags}</div>
          ${hasData
            ? `<div class="day-total">${fmtH(totalH)} <small>שעות</small></div>`
            : `<div class="day-total empty">--</div>`}
        </div>
      </div>
      <div class="day-content">
        ${entries.length > 0 ? `<div class="entries-in-day">
          ${entries.map(e => {
            const h = calcHours(e.start, e.end);
            return `<div class="entry-row">
              ${editingDay === key ? `<button class="entry-del" onclick="deleteEntry('${key}',${e.id})">&#10005;</button>` : ''}
              <div class="entry-times">
                <span>${e.start}</span>
                <span class="arrow">&#8592;</span>
                <span>${e.end}</span>
              </div>
              <div class="entry-hours">${fmtH(h)}</div>
            </div>`;
          }).join('')}
        </div>` : ''}
        ${(entries.length === 0 || editingDay === key) ? `
          <div class="time-row">
            <div class="time-input-wrap">
              <span>התחלה</span>
              <input type="time" id="start-${key}">
            </div>
            <div class="time-input-wrap">
              <span>סיום</span>
              <input type="time" id="end-${key}">
            </div>
          </div>
          <button class="save-entry-btn" onclick="addEntry('${key}')">שמור</button>
        ` : `
          <button class="edit-day-btn" onclick="editDay('${key}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            עריכה
          </button>
        `}
        <div class="toggles-row">
          <label class="toggle-pill">
            <span class="pill-text">מהבית</span>
            <div class="toggle-mini">
              <input type="checkbox" id="home-${key}" ${dayData.home ? 'checked' : ''} onchange="saveToggle('${key}','home')">
              <span class="slider"></span>
            </div>
          </label>
          <label class="toggle-pill">
            <span class="pill-text">נסיעות</span>
            <div class="toggle-mini">
              <input type="checkbox" id="travel-${key}" ${dayData.travel ? 'checked' : ''} onchange="saveToggle('${key}','travel')">
              <span class="slider"></span>
            </div>
          </label>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('daysList').innerHTML = html;
}

function renderDashboard() {
  const m = dashMonth.getMonth();
  const y = dashMonth.getFullYear();
  document.getElementById('dashMonthDisplay').textContent = MONTHS_HE[m] + ' ' + y;

  const daysInMonth = new Date(y, m+1, 0).getDate();
  let totalHours = 0, workDays = 0, homeDays = 0, travelDays = 0;
  let maxDay = 0, maxDayLabel = '';

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(y, m, d);
    const dayData = data[key];
    if (!dayData || !dayData.entries || dayData.entries.length === 0) continue;
    const dayTotal = dayData.entries.reduce((s, e) => s + calcHours(e.start, e.end), 0);
    totalHours += dayTotal;
    workDays++;
    if (dayData.home) homeDays++;
    if (dayData.travel) travelDays++;
    if (dayTotal > maxDay) {
      maxDay = dayTotal;
      const dt = new Date(y, m, d);
      maxDayLabel = `יום ${DAYS_HE[dt.getDay()]}, ${d}`;
    }
  }

  const avgHours = workDays > 0 ? totalHours / workDays : 0;
  const officeDays = workDays - homeDays;
  const workingDaysInMonth = countWorkingDays(y, m);
  const reportProgress = Math.min(100, Math.round((workDays / workingDaysInMonth) * 100));
  const homePercent = workDays > 0 ? Math.round((homeDays / workDays) * 100) : 0;

  document.getElementById('dashContent').innerHTML = `
    <div class="dash-section">
      <div class="dash-title">סיכום חודשי</div>
      <div class="stat-grid">
        <div class="stat-box wide accent">
          <div class="stat-val">${fmtHLabel(totalHours)}</div>
          <div class="stat-lbl">סה"כ שעות</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${workDays}</div>
          <div class="stat-lbl">ימי עבודה</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${fmtH(avgHours)}</div>
          <div class="stat-lbl">ממוצע יומי</div>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-title">התקדמות דיווח</div>
      <div class="progress-bar-wrap">
        <div class="progress-label">
          <span>ימים מדווחים</span>
          <span>${workDays} / ${workingDaysInMonth}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${reportProgress}%"></div>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-title">פילוח מיקום</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val">${homeDays}</div>
          <div class="stat-lbl">ימים מהבית</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${officeDays}</div>
          <div class="stat-lbl">ימים מהמשרד</div>
        </div>
      </div>
      ${workDays > 0 ? `<div class="progress-bar-wrap" style="margin-top:10px">
        <div class="progress-label">
          <span>בית / משרד</span>
          <span>${homePercent}% מהבית</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill green" style="width:${homePercent}%"></div>
        </div>
      </div>` : ''}
    </div>

    <div class="dash-section">
      <div class="dash-title">נסיעות</div>
      <div class="stat-grid">
        <div class="stat-box wide">
          <div class="stat-val">${travelDays}</div>
          <div class="stat-lbl">ימי נסיעות בחודש</div>
        </div>
      </div>
    </div>

    ${maxDay > 0 ? `<div class="dash-section">
      <div class="dash-title">היום הארוך ביותר</div>
      <div class="stat-grid">
        <div class="stat-box wide">
          <div class="stat-val">${fmtHLabel(maxDay)}</div>
          <div class="stat-lbl">${maxDayLabel}</div>
        </div>
      </div>
    </div>` : ''}
  `;
}

function countWorkingDays(y, m) {
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let count = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(y, m, d).getDay();
    if (dow !== 5 && dow !== 6) count++;
  }
  return count;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

renderReport();
</script>
</body>
</html>
