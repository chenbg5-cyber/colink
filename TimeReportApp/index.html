<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>דיווח שעות</title>
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card-hover: #222240;
  --accent: #6c63ff;
  --accent-light: #8b83ff;
  --accent-glow: rgba(108, 99, 255, 0.15);
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --success: #4ecdc4;
  --danger: #ff6b6b;
  --warning: #ffd93d;
  --border: #2a2a45;
  --input-bg: #12122a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

.app-header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
}

.app-header h1 {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  background: linear-gradient(135deg, var(--accent-light), var(--success));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tab-bar {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  background: var(--input-bg);
  border-radius: 12px;
  padding: 4px;
}

.tab-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
}

.tab-btn.active {
  background: var(--accent);
  color: white;
  box-shadow: 0 2px 12px rgba(108, 99, 255, 0.4);
}

.container {
  padding: 16px;
  max-width: 500px;
  margin: 0 auto;
  padding-bottom: 40px;
}

/* Month Navigation */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 16px;
  background: var(--card);
  border-radius: 16px;
  padding: 14px 16px;
  border: 1px solid var(--border);
}

.month-nav button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.month-nav button:active {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(0.92);
}

.month-nav .month-display {
  text-align: center;
  min-width: 140px;
  font-size: 18px;
  font-weight: 700;
}

/* Day Cards */
.days-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.day-card {
  background: var(--card);
  border-radius: 14px;
  border: 1px solid var(--border);
  overflow: hidden;
  transition: all 0.2s;
}

.day-card.weekend {
  opacity: 0.5;
}

.day-card.weekend.has-data {
  opacity: 1;
}

.day-card.today {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.2s;
}

.day-header:active {
  background: var(--card-hover);
}

.day-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.day-name {
  font-size: 15px;
  font-weight: 600;
}

.day-date {
  font-size: 12px;
  color: var(--text-dim);
}

.day-header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.day-total {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-light);
}

.day-total small {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.7;
}

.day-total.empty {
  color: var(--text-dim);
  font-weight: 400;
  font-size: 13px;
}

.day-tags {
  display: flex;
  gap: 4px;
}

.tag {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
}

.tag-home {
  background: rgba(78, 205, 196, 0.15);
  color: var(--success);
}

.tag-hybrid {
  background: rgba(108, 99, 255, 0.15);
  color: var(--accent-light);
}

.tag-travel {
  background: rgba(255, 217, 61, 0.15);
  color: var(--warning);
}

.tag-off {
  background: rgba(255, 107, 107, 0.15);
  color: var(--danger);
}

.off-selector {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.off-btn {
  flex: 1;
  padding: 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.off-btn.active {
  border-color: var(--danger);
  background: rgba(255, 107, 107, 0.1);
  color: var(--danger);
}

.off-btn.clear {
  flex: 0.6;
  border-color: var(--border);
  color: var(--text-dim);
}

.off-btn.clear:hover {
  border-color: var(--text-dim);
}

.day-card.day-off .day-content .time-row,
.day-card.day-off .day-content .loc-selector,
.day-card.day-off .day-content .save-entry-btn,
.day-card.day-off .day-content .edit-day-btn,
.day-card.day-off .day-content .entries-in-day,
.day-card.day-off .day-content .add-entry-btn {
  display: none;
}

.expand-icon {
  color: var(--text-dim);
  font-size: 12px;
  transition: transform 0.2s;
}

.day-card.open .expand-icon {
  transform: rotate(90deg);
}

/* Day Expanded Content */
.day-content {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px solid var(--border);
}

.day-card.open .day-content {
  display: block;
}

.time-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.time-input-wrap {
  flex: 1;
}

.time-input-wrap span {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.time-input-wrap input[type="time"] {
  width: 100%;
  padding: 10px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  text-align: center;
  outline: none;
  -webkit-appearance: none;
}

.time-input-wrap input[type="time"]:focus {
  border-color: var(--accent);
}

.save-entry-btn {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  box-shadow: 0 3px 12px rgba(108, 99, 255, 0.3);
}

.save-entry-btn:active {
  transform: scale(0.97);
}

.edit-day-btn {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
}

.edit-day-btn:active {
  background: var(--card-hover);
  color: var(--text);
}

.edit-day-btn.done {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}

.add-entry-btn {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.add-entry-btn:active {
  background: var(--accent-glow);
  border-color: var(--accent);
}

.loc-selector {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

.loc-label {
  font-size: 13px;
  color: var(--text-dim);
}

.loc-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.loc-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.entry-loc {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
}

.entry-loc.home {
  background: rgba(78, 205, 196, 0.15);
  color: var(--success);
}

.entry-loc.office {
  background: rgba(108, 99, 255, 0.1);
  color: var(--accent-light);
}

.travel-pill {
  margin-top: 10px;
}

.entries-in-day {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.entry-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--input-bg);
  border-radius: 8px;
  padding: 8px 12px;
  border: 1px solid var(--border);
}

.entry-times {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: 8px;
}

.entry-times .arrow {
  color: var(--accent);
  font-size: 12px;
}

.entry-hours {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-light);
}

.entry-del {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: rgba(255, 107, 107, 0.1);
  color: var(--danger);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.entry-edit-icon {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
  flex-shrink: 0;
}

.entry-edit-icon:active {
  color: var(--accent);
}

.entry-edit-form {
  background: var(--input-bg);
  border-radius: 8px;
  padding: 10px 12px;
  border: 1px solid var(--accent);
}

.entry-edit-form .time-row {
  margin-top: 0;
}

.edit-actions {
  display: flex;
  gap: 8px;
}

.edit-actions .save-entry-btn {
  flex: 1;
}

.cancel-edit-btn {
  flex: 0.5;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.toggles-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.toggle-pill {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--input-bg);
  border-radius: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  cursor: pointer;
}

.toggle-pill .pill-text {
  font-size: 13px;
  color: var(--text);
}

.toggle-mini {
  position: relative;
  width: 40px;
  height: 22px;
}

.toggle-mini input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-mini .slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--border);
  border-radius: 22px;
  transition: 0.3s;
}

.toggle-mini .slider:before {
  content: '';
  position: absolute;
  height: 16px;
  width: 16px;
  right: 3px;
  bottom: 3px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: 0.3s;
}

.toggle-mini input:checked + .slider {
  background: var(--accent);
}

.toggle-mini input:checked + .slider:before {
  transform: translateX(-18px);
  background: white;
}

/* Dashboard */
.dash-section {
  margin-bottom: 20px;
}

.dash-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat-box {
  background: var(--card);
  border-radius: 14px;
  padding: 18px 14px;
  text-align: center;
  border: 1px solid var(--border);
}

.stat-box.wide {
  grid-column: 1 / -1;
}

.stat-box.accent {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--card), rgba(108, 99, 255, 0.08));
}

.stat-val {
  font-size: 30px;
  font-weight: 800;
  color: var(--accent-light);
}

.stat-lbl {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
}

.progress-bar-wrap {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  border: 1px solid var(--border);
  margin-bottom: 10px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 8px;
}

.progress-label span:first-child { color: var(--text); font-weight: 600; }
.progress-label span:last-child { color: var(--text-dim); }

.progress-track {
  height: 8px;
  background: var(--input-bg);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width 0.5s ease;
}

.progress-fill.green { background: linear-gradient(90deg, #2ecc71, var(--success)); }
.progress-fill.yellow { background: linear-gradient(90deg, #f39c12, var(--warning)); }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--card);
  border: 1px solid var(--accent);
  color: var(--text);
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  z-index: 1000;
  transition: transform 0.3s ease;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

.version {
  text-align: center;
  padding: 20px;
  color: var(--text-dim);
  font-size: 11px;
  opacity: 0.5;
}

.login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

.login-screen h1 {
  font-size: 28px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.login-screen p {
  color: var(--text-dim);
  margin-bottom: 30px;
  font-size: 15px;
}

.google-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 28px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.google-btn:active {
  background: var(--card-hover);
  transform: scale(0.98);
}

.google-btn svg {
  width: 20px;
  height: 20px;
}

.user-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  background: var(--input-bg);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
}

.user-bar .user-info {
  display: flex;
  align-items: center;
  gap: 8px;
}

.user-bar img {
  width: 22px;
  height: 22px;
  border-radius: 50%;
}

.user-bar button {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  padding: 4px 8px;
}

.user-bar button:hover {
  color: var(--text);
}

.cloud-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}

.cloud-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.cloud-btn:active {
  background: var(--accent-glow);
  color: var(--accent);
}

.sync-indicator {
  font-size: 11px;
  color: var(--success);
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
  <h1>דיווח שעות</h1>
  <p>התחברי עם חשבון Google כדי לשמור את הנתונים בענן</p>
  <button class="google-btn" onclick="googleLogin()">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    כניסה עם Google
  </button>
</div>

<!-- App (hidden until login) -->
<div id="appMain" style="display:none">

<div class="user-bar" id="userBar">
  <div class="user-info">
    <img id="userPhoto" src="" alt="">
    <span id="userName"></span>
  </div>
  <div class="cloud-actions">
    <button class="cloud-btn" onclick="backupFromCloud()">שחזור מענן</button>
    <span class="sync-indicator" id="syncStatus"></span>
    <button class="user-bar button" onclick="signOut()">יציאה</button>
  </div>
</div>

<header class="app-header">
  <h1>דיווח שעות</h1>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('report')">דיווח</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">דשבורד</button>
  </div>
</header>

<div class="container">
  <!-- Report View -->
  <div id="reportView">
    <div class="month-nav">
      <button onclick="changeMonth(1)">&#8250;</button>
      <div class="month-display" id="monthDisplay"></div>
      <button onclick="changeMonth(-1)">&#8249;</button>
    </div>
    <div id="daysList" class="days-list"></div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboardView" style="display:none;">
    <div class="month-nav">
      <button onclick="changeDashMonth(1)">&#8250;</button>
      <div class="month-display" id="dashMonthDisplay"></div>
      <button onclick="changeDashMonth(-1)">&#8249;</button>
    </div>
    <div id="dashContent"></div>
  </div>

  <div class="version">דיווח שעות v3.0</div>
</div>

</div><!-- end appMain -->

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyD_HtHDB6acBl-5rfMHwzUiAJMSgmDm3Ug",

const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

const STORAGE_KEY_BASE = 'timeReportData';
const DAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

let currentMonth = new Date();
let dashMonth = new Date();
let openDay = null;
let editingDay = null;
let editingEntry = null;
let addingEntry = null;
let currentUser = null;
let data = {};

function userStorageKey() {
  return currentUser ? STORAGE_KEY_BASE + '_' + currentUser.uid : STORAGE_KEY_BASE;
}

function loadLocalData() {
  try { return JSON.parse(localStorage.getItem(userStorageKey())) || {}; }
  catch { return {}; }
}

function saveData() {
  localStorage.setItem(userStorageKey(), JSON.stringify(data));
  saveToCloud();
}

let saveTimeout = null;
function saveToCloud() {
  if (!currentUser) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    db.collection('users').doc(currentUser.uid).set({ timeData: JSON.stringify(data) })
      .then(() => { setSyncStatus('נשמר בענן'); })
      .catch(() => { setSyncStatus('שגיאה בשמירה'); });
  }, 1500);
}

function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = msg;
  if (msg === 'נשמר בענן') {
    setTimeout(() => { if (el) el.textContent = ''; }, 3000);
  }
}

async function loadFromCloud() {
  if (!currentUser) return false;
  try {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists && doc.data().timeData) {
      data = JSON.parse(doc.data().timeData);
      localStorage.setItem(userStorageKey(), JSON.stringify(data));
      renderReport();
      return true;
    }
  } catch(e) {}
  return false;
}

async function backupFromCloud() {
  if (!currentUser) { showToast('יש להתחבר קודם'); return; }
  setSyncStatus('טוען מענן...');
  const loaded = await loadFromCloud();
  if (loaded) {
    showToast('הנתונים שוחזרו מהענן');
    setSyncStatus('');
  } else {
    showToast('לא נמצאו נתונים בענן');
    setSyncStatus('');
  }
}

function googleLogin() {
  auth.signInWithPopup(provider).catch(() => {
    auth.signInWithRedirect(provider);
  });
}

function signOut() {
  auth.signOut();
}

auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appMain').style.display = 'block';
    document.getElementById('userName').textContent = user.displayName || user.email;
    document.getElementById('userPhoto').src = user.photoURL || '';

    const cloudLoaded = await loadFromCloud();
    if (!cloudLoaded) {
      const oldData = localStorage.getItem(STORAGE_KEY_BASE);
      const userData = localStorage.getItem(userStorageKey());
      if (userData) {
        data = JSON.parse(userData);
      } else if (oldData) {
        data = JSON.parse(oldData);
        localStorage.setItem(userStorageKey(), oldData);
        localStorage.removeItem(STORAGE_KEY_BASE);
        saveToCloud();
      } else {
        data = {};
      }
    }
    renderReport();
  } else {
    data = {};
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appMain').style.display = 'none';
  }
});

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function getDayData(key) {
  if (!data[key]) data[key] = { entries: [], travel: false, home: false, off: '' };
  if (!data[key].entries) data[key].entries = [];
  return data[key];
}

function setDayOff(key, type) {
  const dayData = getDayData(key);
  dayData.off = dayData.off === type ? '' : type;
  if (dayData.off) {
    dayData.entries = [];
  }
  saveData();
  openDay = key;
  renderReport();
}

function calcHours(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if (diff < 0) diff += 24 * 60;
  return diff / 60;
}

function fmtH(totalHours) {
  if (totalHours === 0) return '0';
  const h = Math.floor(totalHours);
  const m = Math.round((totalHours - h) * 60);
  if (m === 0) return `${h}`;
  return `${h}:${String(m).padStart(2,'0')}`;
}

function fmtHLabel(totalHours) {
  if (totalHours === 0) return '0 שעות';
  const h = Math.floor(totalHours);
  const m = Math.round((totalHours - h) * 60);
  if (m === 0) return `${h} שעות`;
  return `${h}:${String(m).padStart(2,'0')} שעות`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (tab === 'report' && i === 0) || (tab === 'dashboard' && i === 1));
  });
  document.getElementById('reportView').style.display = tab === 'report' ? 'block' : 'none';
  document.getElementById('dashboardView').style.display = tab === 'dashboard' ? 'block' : 'none';
  if (tab === 'dashboard') renderDashboard();
}

function changeMonth(dir) {
  currentMonth.setMonth(currentMonth.getMonth() + dir);
  renderReport();
}

function changeDashMonth(dir) {
  dashMonth.setMonth(dashMonth.getMonth() + dir);
  renderDashboard();
}

function toggleDay(key) {
  if (openDay !== key) editingDay = null;
  openDay = openDay === key ? null : key;
  renderReport();
  if (openDay) {
    setTimeout(() => {
      const el = document.getElementById('day-' + key);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

let pendingLoc = {};

function pickLoc(key, loc) {
  pendingLoc[key] = loc;
  const oBtn = document.getElementById('loc-office-' + key);
  const hBtn = document.getElementById('loc-home-' + key);
  if (oBtn) oBtn.classList.toggle('active', loc === 'office');
  if (hBtn) hBtn.classList.toggle('active', loc === 'home');
}

function editDay(key) {
  editingDay = key;
  openDay = key;
  renderReport();
  setTimeout(() => {
    const el = document.getElementById('day-' + key);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function doneEdit(key) {
  editingDay = null;
  openDay = key;
  renderReport();
}

function startAddEntry(key) {
  addingEntry = key;
  openDay = key;
  renderReport();
}

function addEntry(key) {
  const startEl = document.getElementById('start-' + key);
  const endEl = document.getElementById('end-' + key);
  if (!startEl || !endEl) return;
  const start = startEl.value;
  const end = endEl.value;
  if (!start || !end) { showToast('יש למלא שעת התחלה וסיום'); return; }
  if (start >= end) { showToast('שעת הסיום חייבת להיות אחרי ההתחלה'); return; }
  const dayData = getDayData(key);
  const loc = pendingLoc[key] || 'office';
  dayData.entries.push({ start, end, id: Date.now(), loc });
  dayData.entries.sort((a,b) => a.start.localeCompare(b.start));
  saveData();
  editingDay = null;
  addingEntry = null;
  openDay = key;
  renderReport();
  showToast('רשומה נוספה');
}

function deleteEntry(key, id) {
  const dayData = getDayData(key);
  dayData.entries = dayData.entries.filter(e => e.id !== id);
  saveData();
  openDay = key;
  editingEntry = null;
  renderReport();
  showToast('רשומה נמחקה');
}

function editEntry(key, id) {
  editingEntry = { key, id };
  openDay = key;
  renderReport();
  setTimeout(() => {
    const entry = getDayData(key).entries.find(e => e.id === id);
    if (!entry) return;
    const s = document.getElementById('edit-start-' + id);
    const e = document.getElementById('edit-end-' + id);
    if (s) s.value = entry.start;
    if (e) e.value = entry.end;
  }, 30);
}

function saveEditEntry(key, id) {
  const s = document.getElementById('edit-start-' + id);
  const e = document.getElementById('edit-end-' + id);
  if (!s || !e || !s.value || !e.value) { showToast('יש למלא שעת התחלה וסיום'); return; }
  if (s.value >= e.value) { showToast('שעת הסיום חייבת להיות אחרי ההתחלה'); return; }
  const dayData = getDayData(key);
  const entry = dayData.entries.find(en => en.id === id);
  if (!entry) return;
  entry.start = s.value;
  entry.end = e.value;
  const locBtn = document.querySelector('.edit-loc-btn.active[data-eid="' + id + '"]');
  if (locBtn) entry.loc = locBtn.dataset.loc;
  dayData.entries.sort((a,b) => a.start.localeCompare(b.start));
  saveData();
  editingEntry = null;
  openDay = key;
  renderReport();
  showToast('רשומה עודכנה');
}

function pickEditLoc(id, loc) {
  document.querySelectorAll('.edit-loc-btn[data-eid="' + id + '"]').forEach(b => {
    b.classList.toggle('active', b.dataset.loc === loc);
  });
}

function cancelEditEntry() {
  editingEntry = null;
  renderReport();
}

function saveToggle(key, field) {
  const el = document.getElementById(field + '-' + key);
  if (!el) return;
  const dayData = getDayData(key);
  dayData[field] = el.checked;
  saveData();
  renderReport();
  openDay = key;
  renderReport();
}

function renderReport() {
  const m = currentMonth.getMonth();
  const y = currentMonth.getFullYear();
  document.getElementById('monthDisplay').textContent = MONTHS_HE[m] + ' ' + y;

  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  const daysInMonth = new Date(y, m+1, 0).getDate();

  let html = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(y, m, d);
    const dow = dt.getDay();
    const key = dateKey(y, m, d);
    const dayData = data[key] || { entries: [], travel: false, home: false, off: '' };
    const entries = dayData.entries || [];
    const totalH = entries.reduce((s, e) => s + calcHours(e.start, e.end), 0);
    const isToday = key === todayKey;
    const isWeekend = dow === 5 || dow === 6;
    const hasData = entries.length > 0;
    const isOpen = openDay === key;
    const isDayOff = !!dayData.off;

    let cls = 'day-card';
    if (isToday) cls += ' today';
    if (isWeekend) cls += ' weekend';
    if (hasData) cls += ' has-data';
    if (isOpen) cls += ' open';
    if (isDayOff) cls += ' day-off has-data';

    let tags = '';
    if (isDayOff) {
      const offLabel = dayData.off === 'vacation' ? 'חופש' : 'מחלה';
      tags += `<span class="tag tag-off">${offLabel}</span>`;
    } else {
      const hasHome = entries.some(e => e.loc === 'home');
      const hasOffice = entries.some(e => !e.loc || e.loc === 'office');
      if (hasHome && hasOffice) tags += '<span class="tag tag-hybrid">משולב</span>';
      else if (hasHome) tags += '<span class="tag tag-home">בית</span>';
    }
    if (dayData.travel) tags += '<span class="tag tag-travel">נסיעה</span>';

    html += `<div class="${cls}" id="day-${key}">
      <div class="day-header" onclick="toggleDay('${key}')">
        <div class="day-header-right">
          <span class="expand-icon">&#8250;</span>
          <div>
            <div class="day-name">יום ${DAYS_HE[dow]}, ${d}</div>
          </div>
        </div>
        <div class="day-header-left">
          <div class="day-tags">${tags}</div>
          ${isDayOff
            ? `<div class="day-total empty">${dayData.off === 'vacation' ? 'חופש' : 'מחלה'}</div>`
            : hasData
              ? `<div class="day-total">${fmtH(totalH)} <small>שעות</small></div>`
              : `<div class="day-total empty">--</div>`}
        </div>
      </div>
      <div class="day-content">
        ${entries.length > 0 ? `<div class="entries-in-day">
          ${entries.map(e => {
            const h = calcHours(e.start, e.end);
            const locTag = e.loc === 'home' ? '<span class="entry-loc home">בית</span>' : '<span class="entry-loc office">משרד</span>';
            const isEditing = editingEntry && editingEntry.key === key && editingEntry.id === e.id;
            if (isEditing) {
              return `<div class="entry-edit-form">
                <div class="time-row">
                  <div class="time-input-wrap">
                    <span>התחלה</span>
                    <input type="time" id="edit-start-${e.id}">
                  </div>
                  <div class="time-input-wrap">
                    <span>סיום</span>
                    <input type="time" id="edit-end-${e.id}">
                  </div>
                </div>
                <div class="loc-selector">
                  <span class="loc-label">מיקום:</span>
                  <button class="loc-btn edit-loc-btn ${e.loc !== 'home' ? 'active' : ''}" data-eid="${e.id}" data-loc="office" onclick="pickEditLoc(${e.id},'office')">משרד</button>
                  <button class="loc-btn edit-loc-btn ${e.loc === 'home' ? 'active' : ''}" data-eid="${e.id}" data-loc="home" onclick="pickEditLoc(${e.id},'home')">בית</button>
                </div>
                <div class="edit-actions">
                  <button class="save-entry-btn" onclick="saveEditEntry('${key}',${e.id})">שמור</button>
                  <button class="cancel-edit-btn" onclick="cancelEditEntry()">ביטול</button>
                </div>
              </div>`;
            }
            return `<div class="entry-row">
              ${editingDay === key ? `<button class="entry-del" onclick="deleteEntry('${key}',${e.id})">&#10005;</button>` : ''}
              <div class="entry-times">
                <span>${e.start}</span>
                <span class="arrow">&#8592;</span>
                <span>${e.end}</span>
              </div>
              ${locTag}
              <div class="entry-hours">${fmtH(h)}</div>
              <button class="entry-edit-icon" onclick="editEntry('${key}',${e.id})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
              </button>
            </div>`;
          }).join('')}
        </div>` : ''}
        ${entries.length > 0 && editingDay !== key ? `
          <button class="edit-day-btn" onclick="editDay('${key}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            עריכה
          </button>
        ` : ''}
        ${editingDay === key ? `<button class="edit-day-btn done" onclick="doneEdit('${key}')">סיום עריכה</button>` : ''}
        ${(entries.length === 0 || addingEntry === key) ? `
          <div class="time-row">
            <div class="time-input-wrap">
              <span>התחלה</span>
              <input type="time" id="start-${key}">
            </div>
            <div class="time-input-wrap">
              <span>סיום</span>
              <input type="time" id="end-${key}">
            </div>
          </div>
          <div class="loc-selector">
            <span class="loc-label">מיקום:</span>
            <button class="loc-btn active" id="loc-office-${key}" onclick="pickLoc('${key}','office')">משרד</button>
            <button class="loc-btn" id="loc-home-${key}" onclick="pickLoc('${key}','home')">בית</button>
          </div>
          <button class="save-entry-btn" onclick="addEntry('${key}')">שמור</button>
        ` : entries.length > 0 ? `
          <button class="add-entry-btn" onclick="startAddEntry('${key}')">+ הוסף שעות</button>
        ` : ''}
        <div class="off-selector">
          <button class="off-btn ${dayData.off === 'vacation' ? 'active' : ''}" onclick="setDayOff('${key}','vacation')">חופש</button>
          <button class="off-btn ${dayData.off === 'sick' ? 'active' : ''}" onclick="setDayOff('${key}','sick')">מחלה</button>
          ${dayData.off ? `<button class="off-btn clear" onclick="setDayOff('${key}','${dayData.off}')">ביטול</button>` : ''}
        </div>
        <label class="toggle-pill travel-pill">
          <span class="pill-text">נסיעות</span>
          <div class="toggle-mini">
            <input type="checkbox" id="travel-${key}" ${dayData.travel ? 'checked' : ''} onchange="saveToggle('${key}','travel')">
            <span class="slider"></span>
          </div>
        </label>
      </div>
    </div>`;
  }

  document.getElementById('daysList').innerHTML = html;
}

function renderDashboard() {
  const m = dashMonth.getMonth();
  const y = dashMonth.getFullYear();
  document.getElementById('dashMonthDisplay').textContent = MONTHS_HE[m] + ' ' + y;

  const daysInMonth = new Date(y, m+1, 0).getDate();
  let totalHours = 0, workDays = 0, homeDays = 0, officeDays = 0, hybridDays = 0;
  let travelDays = 0, vacationDays = 0, sickDays = 0;
  let maxDay = 0, maxDayLabel = '';

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(y, m, d);
    const dayData = data[key];
    if (!dayData) continue;
    if (dayData.off === 'vacation') { vacationDays++; continue; }
    if (dayData.off === 'sick') { sickDays++; continue; }
    if (!dayData.entries || dayData.entries.length === 0) continue;
    const dayTotal = dayData.entries.reduce((s, e) => s + calcHours(e.start, e.end), 0);
    totalHours += dayTotal;
    workDays++;
    const hasHome = dayData.entries.some(e => e.loc === 'home');
    const hasOffice = dayData.entries.some(e => !e.loc || e.loc === 'office');
    if (hasHome && hasOffice) hybridDays++;
    else if (hasHome) homeDays++;
    else officeDays++;
    if (dayData.travel) travelDays++;
    if (dayTotal > maxDay) {
      maxDay = dayTotal;
      const dt = new Date(y, m, d);
      maxDayLabel = `יום ${DAYS_HE[dt.getDay()]}, ${d}`;
    }
  }

  const avgHours = workDays > 0 ? totalHours / workDays : 0;
  const workingDaysInMonth = countWorkingDays(y, m);
  const allReportedDays = workDays + vacationDays + sickDays;
  const reportProgress = Math.min(100, Math.round((allReportedDays / workingDaysInMonth) * 100));

  document.getElementById('dashContent').innerHTML = `
    <div class="dash-section">
      <div class="dash-title">סיכום חודשי</div>
      <div class="stat-grid">
        <div class="stat-box wide accent">
          <div class="stat-val">${fmtHLabel(totalHours)}</div>
          <div class="stat-lbl">סה"כ שעות</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${workDays}</div>
          <div class="stat-lbl">ימי עבודה</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${fmtH(avgHours)}</div>
          <div class="stat-lbl">ממוצע יומי</div>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-title">התקדמות דיווח</div>
      <div class="progress-bar-wrap">
        <div class="progress-label">
          <span>ימים מדווחים</span>
          <span>${allReportedDays} / ${workingDaysInMonth}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${reportProgress}%"></div>
        </div>
      </div>
    </div>

    ${(vacationDays > 0 || sickDays > 0) ? `<div class="dash-section">
      <div class="dash-title">היעדרויות</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val">${vacationDays}</div>
          <div class="stat-lbl">ימי חופש</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${sickDays}</div>
          <div class="stat-lbl">ימי מחלה</div>
        </div>
      </div>
    </div>` : ''}

    <div class="dash-section">
      <div class="dash-title">פילוח מיקום</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val">${officeDays}</div>
          <div class="stat-lbl">משרד</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${homeDays}</div>
          <div class="stat-lbl">בית</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${hybridDays}</div>
          <div class="stat-lbl">משולב</div>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-title">נסיעות</div>
      <div class="stat-grid">
        <div class="stat-box wide">
          <div class="stat-val">${travelDays}</div>
          <div class="stat-lbl">ימי נסיעות בחודש</div>
        </div>
      </div>
    </div>

    ${maxDay > 0 ? `<div class="dash-section">
      <div class="dash-title">היום הארוך ביותר</div>
      <div class="stat-grid">
        <div class="stat-box wide">
          <div class="stat-val">${fmtHLabel(maxDay)}</div>
          <div class="stat-lbl">${maxDayLabel}</div>
        </div>
      </div>
    </div>` : ''}
  `;
}

function countWorkingDays(y, m) {
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let count = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(y, m, d).getDay();
    if (dow !== 5 && dow !== 6) count++;
  }
  return count;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

renderReport();
</script>
