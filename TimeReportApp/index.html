<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#232344">
<title>דיווח שעות</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #232344;
  --card: #2d2d55;
  --card-hover: #383868;
  --accent: #3b82f6;
  --accent-light: #60a5fa;
  --accent-glow: rgba(59, 130, 246, 0.15);
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --success: #4ecdc4;
  --danger: #ff6b6b;
  --warning: #ffd93d;
  --border: #44446a;
  --input-bg: #262650;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

.app-header {
  background: linear-gradient(135deg, #2d2d55 0%, #283050 100%);
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
}

.app-header h1 {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  background: linear-gradient(135deg, var(--accent-light), var(--success));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.sidebar-toggle {
  position: absolute;
  left: 0;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-dim);
  width: 38px;
  height: 38px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.sidebar-toggle:active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.sidebar-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s;
}

.sidebar-overlay.open {
  opacity: 1;
  visibility: visible;
}

.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 300px;
  max-width: 85vw;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  overflow-y: auto;
  padding: 0;
  border-right: 1px solid var(--border);
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 14px 10px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, #2d2d55 0%, #283050 100%);
  position: sticky;
  top: 0;
  z-index: 1;
}

.sidebar-title {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-light), var(--success));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-close {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.sidebar-close:active {
  background: var(--danger);
  color: white;
}

.sidebar .month-nav {
  margin: 10px 12px;
  padding: 10px 12px;
}

.sidebar .month-nav .month-display {
  font-size: 15px;
  min-width: 110px;
}

.sidebar .month-nav button {
  width: 32px;
  height: 32px;
  font-size: 16px;
}

.sidebar #dashContent {
  padding: 0 12px 20px;
}

.container {
  padding: 16px;
  max-width: 500px;
  margin: 0 auto;
  padding-bottom: 40px;
}

/* Month Navigation */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 16px;
  background: var(--card);
  border-radius: 16px;
  padding: 14px 16px;
  border: 1px solid var(--border);
}

.month-nav button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.month-nav button:active {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(0.92);
}

.month-nav .month-display {
  text-align: center;
  min-width: 140px;
  font-size: 18px;
  font-weight: 700;
}

/* Calendar Grid */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-header {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  padding: 6px 0;
}

.cal-cell {
  background: var(--card);
  border-radius: 8px;
  border: 1px solid var(--border);
  min-height: 54px;
  padding: 4px 2px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: all 0.15s;
  position: relative;
}

.cal-tip {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  white-space: pre-line;
  z-index: 50;
  min-width: 130px;
  text-align: right;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  pointer-events: none;
  line-height: 1.6;
}

.cal-tip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--accent);
}

.cal-cell:hover .cal-tip {
  display: block;
}

.cal-cell:active {
  background: var(--card-hover);
  transform: scale(0.93);
}

.cal-cell.empty {
  background: transparent;
  border-color: transparent;
  cursor: default;
}

.cal-cell.empty:active { transform: none; }

.cal-cell.weekend { opacity: 0.45; }
.cal-cell.weekend.has-data { opacity: 1; }

.cal-cell.today {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.cal-day-num {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  align-self: flex-end;
  line-height: 1;
}

.cal-cell.today .cal-day-num { color: var(--accent-light); }

.cal-hours {
  font-size: 15px;
  font-weight: 800;
  color: var(--accent-light);
  line-height: 1;
  margin-top: 3px;
}

.cal-loc-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  margin-top: 3px;
}

.cal-loc-dot.home { background: var(--success); }
.cal-loc-dot.office { background: var(--accent-light); }
.cal-loc-dot.hybrid { background: var(--warning); }

.cal-off-badge {
  font-size: 8px;
  font-weight: 700;
  color: var(--danger);
  margin-top: 3px;
}

.cal-holiday {
  font-size: 7px;
  font-weight: 600;
  color: var(--warning);
  margin-top: 2px;
  line-height: 1.2;
}

.cal-cell.holiday {
  border-color: rgba(255, 217, 61, 0.3);
}

.cal-week-total { display: none; }

/* Day Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 300;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px 16px 30px;
  border-top: 1px solid var(--border);
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
}

.modal-close {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:active {
  background: var(--danger);
  color: white;
}

.modal-total {
  text-align: center;
  padding: 10px;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent-light);
  background: var(--accent-glow);
  border-radius: 8px;
  margin-top: 10px;
}

.off-selector {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.off-btn {
  flex: 1;
  padding: 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.off-btn.active {
  border-color: var(--danger);
  background: rgba(255, 107, 107, 0.1);
  color: var(--danger);
}

.off-btn.clear {
  flex: 0.6;
  border-color: var(--border);
  color: var(--text-dim);
}

.off-btn.clear:hover { border-color: var(--text-dim); }

.time-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.time-input-wrap {
  flex: 1;
}

.time-input-wrap span {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.time-input-wrap input[type="time"] {
  width: 100%;
  padding: 10px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  text-align: center;
  outline: none;
  -webkit-appearance: none;
}

.time-input-wrap input[type="time"]:focus {
  border-color: var(--accent);
}

.save-entry-btn {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  box-shadow: 0 3px 12px rgba(59, 130, 246, 0.3);
}

.save-entry-btn:active {
  transform: scale(0.97);
}

.edit-day-btn {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
}

.edit-day-btn:active {
  background: var(--card-hover);
  color: var(--text);
}

.edit-day-btn.done {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}

.add-entry-btn {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.add-entry-btn:active {
  background: var(--accent-glow);
  border-color: var(--accent);
}

.loc-selector {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

.loc-label {
  font-size: 13px;
  color: var(--text-dim);
}

.loc-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.loc-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.entry-loc {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
}

.entry-loc.home {
  background: rgba(78, 205, 196, 0.15);
  color: var(--success);
}

.entry-loc.office {
  background: rgba(59, 130, 246, 0.1);
  color: var(--accent-light);
}

.travel-pill {
  margin-top: 10px;
}

.entries-in-day {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.entry-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--input-bg);
  border-radius: 8px;
  padding: 8px 12px;
  border: 1px solid var(--border);
}

.entry-times {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: 8px;
}

.entry-times .arrow {
  color: var(--accent);
  font-size: 12px;
}

.entry-hours {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-light);
}

.entry-del {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: rgba(255, 107, 107, 0.1);
  color: var(--danger);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.entry-edit-icon {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
  flex-shrink: 0;
}

.entry-edit-icon:active {
  color: var(--accent);
}

.entry-edit-form {
  background: var(--input-bg);
  border-radius: 8px;
  padding: 10px 12px;
  border: 1px solid var(--accent);
}

.entry-edit-form .time-row {
  margin-top: 0;
}

.edit-actions {
  display: flex;
  gap: 8px;
}

.edit-actions .save-entry-btn {
  flex: 1;
}

.cancel-edit-btn {
  flex: 0.5;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text-dim);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.toggles-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.toggle-pill {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--input-bg);
  border-radius: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  cursor: pointer;
}

.toggle-pill .pill-text {
  font-size: 13px;
  color: var(--text);
}

.toggle-mini {
  position: relative;
  width: 40px;
  height: 22px;
}

.toggle-mini input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-mini .slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--border);
  border-radius: 22px;
  transition: 0.3s;
}

.toggle-mini .slider:before {
  content: '';
  position: absolute;
  height: 16px;
  width: 16px;
  right: 3px;
  bottom: 3px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: 0.3s;
}

.toggle-mini input:checked + .slider {
  background: var(--accent);
}

.toggle-mini input:checked + .slider:before {
  transform: translateX(-18px);
  background: white;
}

/* Dashboard */
.dash-section {
  margin-bottom: 14px;
}

.dash-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.stat-box {
  background: var(--card);
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
  border: 1px solid var(--border);
}

.stat-box.wide {
  grid-column: 1 / -1;
}

.stat-box.accent {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--card), rgba(59, 130, 246, 0.08));
}

.stat-val {
  font-size: 20px;
  font-weight: 800;
  color: var(--accent-light);
}

.stat-lbl {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
}

.progress-bar-wrap {
  background: var(--card);
  border-radius: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  margin-bottom: 6px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 8px;
}

.progress-label span:first-child { color: var(--text); font-weight: 600; }
.progress-label span:last-child { color: var(--text-dim); }

.progress-track {
  height: 8px;
  background: var(--input-bg);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width 0.5s ease;
}

.progress-fill.green { background: linear-gradient(90deg, #2ecc71, var(--success)); }
.progress-fill.yellow { background: linear-gradient(90deg, #f39c12, var(--warning)); }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--card);
  border: 1px solid var(--accent);
  color: var(--text);
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  z-index: 1000;
  transition: transform 0.3s ease;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

.version {
  text-align: center;
  padding: 20px;
  color: var(--text-dim);
  font-size: 11px;
  opacity: 0.5;
}

.login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

.login-screen h1 {
  font-size: 28px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.login-screen p {
  color: var(--text-dim);
  margin-bottom: 30px;
  font-size: 15px;
}

.google-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 28px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.google-btn:active {
  background: var(--card-hover);
  transform: scale(0.98);
}

.google-btn svg {
  width: 20px;
  height: 20px;
}

.onboarding-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

.onboarding-card {
  background: var(--card);
  border-radius: 16px;
  padding: 32px 24px;
  width: 100%;
  max-width: 360px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.onboarding-card h2 {
  font-size: 22px;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.onboarding-card p {
  color: var(--text-dim);
  font-size: 14px;

<script>
firebase.initializeApp({
  apiKey: "AIzaSyD_HtHDB6acBl-5rfMHwzUiAJMSgmDm3Ug",
  authDomain: "time-report-app-il.firebaseapp.com",
  projectId: "time-report-app-il",
  storageBucket: "time-report-app-il.firebasestorage.app",
  messagingSenderId: "116713899150",
  appId: "1:116713899150:web:6b2f12daf8d86d8f08b5df"
});

const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
const provider = new firebase.auth.GoogleAuthProvider();

const STORAGE_KEY_BASE = 'timeReportData';
const DAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

let currentMonth = new Date();
let dashMonth = new Date();
let editingEntry = null;
let addingEntry = null;
let currentUser = null;
let data = {};
let modalKey = null;
let userProfile = null;
let realtimeUnsubscribe = null;
let activeProjectId = null;

function userStorageKey() {
  return currentUser ? STORAGE_KEY_BASE + '_' + currentUser.uid : STORAGE_KEY_BASE;
}

function migrateData() {
  if (data._projects) return;
  const projectName = (userProfile && userProfile.project) || 'ברירת מחדל';
  const pid = 'proj_default';
  const oldEntries = {};
  Object.keys(data).forEach(k => {
    if (k.match(/^\d{4}-\d{2}-\d{2}$/)) {
      oldEntries[k] = data[k];
      delete data[k];
    }
  });
  data._projects = [{ id: pid, name: projectName }];
  data._active = pid;
  data[pid] = oldEntries;
  activeProjectId = pid;
}

function getProjects() {
  return data._projects || [];
}

function getProjectData() {
  const pid = activeProjectId || data._active || 'proj_default';
  if (!data[pid]) data[pid] = {};
  return data[pid];
}

function setActiveProject(pid) {
  activeProjectId = pid;
  data._active = pid;
  saveData();
  renderProjectTabs();
  refreshViews();
}

function loadLocalData() {
  try { return JSON.parse(localStorage.getItem(userStorageKey())) || {}; }
  catch { return {}; }
}

function saveData() {
  localStorage.setItem(userStorageKey(), JSON.stringify(data));
  saveToCloud();
}

let saveTimeout = null;
let skipNextSnapshot = false;
function saveToCloud() {
  if (!currentUser) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    skipNextSnapshot = true;
    db.collection('users').doc(currentUser.uid).set({ timeData: JSON.stringify(data) }, { merge: true })
      .then(() => { setSyncStatus('נשמר בענן'); })
      .catch(() => { setSyncStatus('שגיאה בשמירה'); });
  }, 1500);
}

function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = msg;
  if (msg === 'נשמר בענן') {
    setTimeout(() => { if (el) el.textContent = ''; }, 3000);
  }
}

async function loadFromCloud() {
  if (!currentUser) return false;
  try {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists && doc.data().timeData) {
      data = JSON.parse(doc.data().timeData);
      localStorage.setItem(userStorageKey(), JSON.stringify(data));
      return true;
    }
  } catch(e) {
    console.log('Cloud load error:', e);
  }
  return false;
}

function renderProjectTabs() {
  const projects = getProjects();
  const el = document.getElementById('projectTabs');
  if (!el) return;
  if (projects.length === 0) { el.innerHTML = ''; return; }
  let html = '';
  projects.forEach(p => {
    const active = p.id === activeProjectId ? ' active' : '';
    html += `<button class="project-tab${active}" onclick="setActiveProject('${p.id}')" oncontextmenu="event.preventDefault();openProjectEdit('${p.id}')">${p.name}</button>`;
  });
  html += `<button class="project-add-btn" onclick="openProjectEdit(null)">+ הוסף פרויקט</button>`;
  el.innerHTML = html;
}

function openProjectEdit(pid) {
  const modal = document.getElementById('projectEditModal');
  const title = document.getElementById('projectEditTitle');
  const input = document.getElementById('projectEditName');
  const actions = document.getElementById('projectEditActions');
  modal.classList.add('open');

  if (pid) {
    const proj = getProjects().find(p => p.id === pid);
    title.textContent = 'עריכת פרויקט';
    input.value = proj ? proj.name : '';
    let btns = `<button class="proj-save" onclick="saveProjectEdit('${pid}')">שמור</button>`;
    btns += `<button class="proj-cancel" onclick="closeProjectEdit()">ביטול</button>`;
    if (getProjects().length > 1) {
      btns += `<button class="proj-delete" onclick="deleteProject('${pid}')">&#10005;</button>`;
    }
    actions.innerHTML = btns;
  } else {
    title.textContent = 'פרויקט חדש';
    input.value = '';
    actions.innerHTML = `
      <button class="proj-save" onclick="addNewProject()">הוסף</button>
      <button class="proj-cancel" onclick="closeProjectEdit()">ביטול</button>
    `;
  }
  setTimeout(() => input.focus(), 100);
}

function closeProjectEdit() {
  document.getElementById('projectEditModal').classList.remove('open');
}

function addNewProject() {
  const name = document.getElementById('projectEditName').value.trim();
  if (!name) { showToast('נא להזין שם פרויקט'); return; }
  const pid = 'proj_' + Date.now();
  if (!data._projects) data._projects = [];
  data._projects.push({ id: pid, name });
  data[pid] = {};
  activeProjectId = pid;
  data._active = pid;
  saveData();
  closeProjectEdit();
  renderProjectTabs();
  refreshViews();
  showToast('פרויקט נוסף: ' + name);
}

function saveProjectEdit(pid) {
  const name = document.getElementById('projectEditName').value.trim();
  if (!name) { showToast('נא להזין שם פרויקט'); return; }
  const proj = getProjects().find(p => p.id === pid);
  if (proj) proj.name = name;
  saveData();
  closeProjectEdit();
  renderProjectTabs();
  showToast('פרויקט עודכן');
}

function deleteProject(pid) {
  const projects = getProjects();
  if (projects.length <= 1) { showToast('לא ניתן למחוק את הפרויקט האחרון'); return; }
  data._projects = projects.filter(p => p.id !== pid);
  delete data[pid];
  if (activeProjectId === pid) {
    activeProjectId = data._projects[0].id;
    data._active = activeProjectId;
  }
  saveData();
  closeProjectEdit();
  renderProjectTabs();
  refreshViews();

function checkMonthEndReminder() {
  const now = new Date();
  const today = now.getDate();
  const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const daysLeft = lastDay - today;

  const dismissKey = 'reminder_dismissed_' + now.getFullYear() + '_' + now.getMonth();
  if (localStorage.getItem(dismissKey)) return;

  if (daysLeft <= 1) {
    const banner = document.getElementById('reminderBanner');
    const text = document.getElementById('reminderText');
    if (!banner || !text) return;

    const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
    const month = monthNames[now.getMonth()];

    if (daysLeft === 0) {
      text.textContent = `היום הוא היום האחרון של ${month}! נא לוודא שדיווח השעות ב-TS מעודכן`;
    } else {
      text.textContent = `מחר הוא היום האחרון של ${month} - נא לדווח שעות ב-TS`;
    }
    banner.style.display = 'block';

    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('דיווח שעות', { body: text.textContent, icon: 'icon-192.png' });
    } else if ('Notification' in window && Notification.permission !== 'denied') {
      Notification.requestPermission().then(p => {
        if (p === 'granted') new Notification('דיווח שעות', { body: text.textContent, icon: 'icon-192.png' });
      });
    }
  }
}

function dismissReminder() {
  const now = new Date();
  localStorage.setItem('reminder_dismissed_' + now.getFullYear() + '_' + now.getMonth(), '1');
  document.getElementById('reminderBanner').style.display = 'none';
}

function startRealtimeSync() {
  if (realtimeUnsubscribe) realtimeUnsubscribe();
  if (!currentUser) return;
  realtimeUnsubscribe = db.collection('users').doc(currentUser.uid)
    .onSnapshot(doc => {
      if (skipNextSnapshot) { skipNextSnapshot = false; return; }
      if (doc.exists && doc.data().timeData) {
        const newData = JSON.parse(doc.data().timeData);
        data = newData;
        migrateData();
        activeProjectId = data._active || activeProjectId;
        localStorage.setItem(userStorageKey(), JSON.stringify(data));
        renderProjectTabs();
        renderReport();
        if (modalKey) renderModal();
      }
      if (doc.exists && doc.data().profile) {
        userProfile = doc.data().profile;
        localStorage.setItem('profile_' + currentUser.uid, JSON.stringify(userProfile));
        updateGreeting();
        document.getElementById('userName').textContent = userProfile.name;
      }
    }, err => { console.log('Realtime sync error:', err); });
}

function stopRealtimeSync() {
  if (realtimeUnsubscribe) { realtimeUnsubscribe(); realtimeUnsubscribe = null; }
}

async function backupFromCloud() {
  if (!currentUser) { showToast('יש להתחבר קודם'); return; }
  setSyncStatus('טוען מענן...');
  let loaded = await loadFromCloud();
  if (!loaded) {
    await new Promise(r => setTimeout(r, 2000));
    loaded = await loadFromCloud();
  }
  if (!loaded) {
    try {
      const doc = await db.collection('users').doc(currentUser.uid).get({ source: 'cache' });
      if (doc.exists && doc.data().timeData) {
        data = JSON.parse(doc.data().timeData);
        localStorage.setItem(userStorageKey(), JSON.stringify(data));
        loaded = true;
      }
    } catch(e) {}

  if (loaded) {

async function handleUser(user) {
  currentUser = user;
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';

    userProfile = loadProfileLocal();

    if (!userProfile) {
      document.getElementById('appMain').style.display = 'none';
      document.getElementById('onboardingScreen').style.display = 'flex';
      const nameInput = document.getElementById('onboardName');
      if (nameInput && !nameInput.value && user.displayName) {
        nameInput.value = user.displayName.split(' ')[0];
      }
      loadProfileCloud().then(p => {
        if (p) {
          userProfile = p;
          document.getElementById('onboardingScreen').style.display = 'none';
          document.getElementById('appMain').style.display = 'block';
          updateGreeting();
          renderReport();
        }
      });
    } else {
      document.getElementById('onboardingScreen').style.display = 'none';
      document.getElementById('appMain').style.display = 'block';
      updateGreeting();
    }

    document.getElementById('userName').textContent = userProfile ? userProfile.name : (user.displayName || user.email);
    document.getElementById('userEmail').textContent = user.email || '';
    const photo = user.photoURL || '';
    const photoEl = document.getElementById('userPhoto');
    const photoMenu = document.getElementById('userPhotoMenu');
    const profileIcon = document.getElementById('profileIcon');
    if (photo) {
      photoEl.src = photo; photoEl.style.display = 'block';
      photoMenu.src = photo;
      if (profileIcon) profileIcon.style.display = 'none';
    } else {
      photoEl.style.display = 'none';
      if (profileIcon) profileIcon.style.display = 'block';
    }

    setSyncStatus('טוען נתונים...');
    let cloudLoaded = false;
    try {
      const doc = await db.collection('users').doc(user.uid).get({ source: 'cache' });
      if (doc.exists && doc.data().timeData) {
        data = JSON.parse(doc.data().timeData);
        localStorage.setItem(userStorageKey(), JSON.stringify(data));
        cloudLoaded = true;
      }
    } catch(e) {}

    if (!cloudLoaded) {
      const userData = localStorage.getItem(userStorageKey());
      if (userData) {
        try { data = JSON.parse(userData); cloudLoaded = true; } catch(e) {}
      }
    }

    if (cloudLoaded) {
      setSyncStatus('');
    } else {
      let serverLoaded = await loadFromCloud();
      if (!serverLoaded) {
        await new Promise(r => setTimeout(r, 2000));
        serverLoaded = await loadFromCloud();
      }
      if (serverLoaded) {
        setSyncStatus('נטען מהענן');
        setTimeout(() => setSyncStatus(''), 2000);
      } else {
        data = {};
        setSyncStatus('');
      }
    }

    migrateData();
    activeProjectId = data._active || (data._projects && data._projects[0] && data._projects[0].id) || 'proj_default';
    renderProjectTabs();
    renderReport();
    startRealtimeSync();
    checkMonthEndReminder();
  } else {
    stopRealtimeSync();
    data = {};
    userProfile = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appMain').style.display = 'none';
    document.getElementById('onboardingScreen').style.display = 'none';
  }
}

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function getDayData(key) {
  const pd = getProjectData();
  if (!pd[key]) pd[key] = { entries: [], travel: false, home: false, off: '' };
  if (!pd[key].entries) pd[key].entries = [];
  return pd[key];
}

function setDayOff(key, type) {
  const dayData = getDayData(key);
  dayData.off = dayData.off === type ? '' : type;
  if (dayData.off) {
    dayData.entries = [];
  }
  saveData();
  refreshViews();
}

function refreshViews() {
  renderReport();
  if (modalKey) renderModal();
}

function calcHours(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if (diff < 0) diff += 24 * 60;
  return diff / 60;
}

function fmtH(totalHours) {
  if (totalHours === 0) return '0';
  const h = Math.floor(totalHours);
  const m = Math.round((totalHours - h) * 60);
  if (m === 0) return `${h}`;
  return `${h}:${String(m).padStart(2,'0')}`;
}

function fmtHLabel(totalHours) {
  if (totalHours === 0) return '0 שעות';
  const h = Math.floor(totalHours);
  const m = Math.round((totalHours - h) * 60);
  if (m === 0) return `${h} שעות`;
  return `${h}:${String(m).padStart(2,'0')} שעות`;
}

  const startEl = document.getElementById('start-' + key);

  if (!startEl || !endEl) return;
  const start = startEl.value;
  const end = endEl.value;

  const dayData = getDayData(key);
  const loc = pendingLoc[key] || 'home';
  dayData.entries.push({ start, end, id: Date.now(), loc });
  dayData.entries.sort((a,b) => a.start.localeCompare(b.start));
  const travelEl = document.getElementById('travel-' + key);
  if (travelEl) dayData.travel = travelEl.checked;
  saveData();
  addingEntry = null;
  showToast('רשומה נוספה');
  refreshViews();

function renderReport() {
  const m = currentMonth.getMonth();
  const y = currentMonth.getFullYear();
  document.getElementById('monthDisplay').textContent = MONTHS_HE[m] + ' ' + y;

  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const firstDow = new Date(y, m, 1).getDay();

  const dayShort = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  let html = dayShort.map(n => `<div class="cal-header">${n}</div>`).join('');

  for (let i = 0; i < firstDow; i++) {
    html += '<div class="cal-cell empty"></div>';
  }

  let weekHours = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(y, m, d);
    const dow = dt.getDay();
    const key = dateKey(y, m, d);
    const pd = getProjectData();
    const dayData = pd[key] || { entries: [], travel: false, home: false, off: '' };
    const entries = dayData.entries || [];
    const totalH = entries.reduce((s, e) => s + calcHours(e.start, e.end), 0);
    const isToday = key === todayKey;
    const isWeekend = dow === 5 || dow === 6;
    const hasData = entries.length > 0;
    const isDayOff = !!dayData.off;

    weekHours += totalH;

    const holiday = HOLIDAYS[key];

    let cls = 'cal-cell';
    if (isToday) cls += ' today';
    if (isWeekend) cls += ' weekend';
    if (hasData || isDayOff) cls += ' has-data';
    if (holiday) cls += ' holiday';

    let content = `<span class="cal-day-num">${d}</span>`;

    if (holiday) {
      content += `<span class="cal-holiday">${holiday}</span>`;
    }

    if (isDayOff) {
      content += `<span class="cal-off-badge">${dayData.off === 'vacation' ? 'חופש' : 'מחלה'}</span>`;
    } else if (hasData) {
      content += `<span class="cal-hours">${fmtH(totalH)}</span>`;
      const hasHome = entries.some(e => e.loc === 'home');
      const hasOffice = entries.some(e => !e.loc || e.loc === 'office');
      if (hasHome && hasOffice) content += '<span class="cal-loc-dot hybrid"></span>';
      else if (hasHome) content += '<span class="cal-loc-dot home"></span>';
      else content += '<span class="cal-loc-dot office"></span>';
      const tipLines = entries.map(e => {
        const loc = e.loc === 'home' ? 'בית' : 'משרד';
        return `${e.start} - ${e.end}  ${loc}`;
      });
      tipLines.push(`סה"כ: ${fmtHLabel(totalH)}`);
      content += `<div class="cal-tip">${tipLines.join('\n')}</div>`;
    }

    html += `<div class="${cls}" onclick="openDayModal('${key}')">${content}</div>`;

    if (dow === 6 || d === daysInMonth) {
      if (d === daysInMonth && dow < 6) {
        for (let i = dow + 1; i <= 6; i++) {
          html += '<div class="cal-cell empty"></div>';
        }
      }
      if (weekHours > 0) {
        html += `<div class="cal-week-total">סה"כ שבועי: ${fmtH(weekHours)} שעות</div>`;
      }
      weekHours = 0;
    }
  }

  document.getElementById('daysList').innerHTML = html;
}

function renderModal() {
  if (!modalKey) return;
  const [y, mo, d] = modalKey.split('-').map(Number);
  const dt = new Date(y, mo-1, d);
  const dow = dt.getDay();
  const pd = getProjectData();
  const dayData = pd[modalKey] || { entries: [], travel: false, home: false, off: '' };
  const entries = dayData.entries || [];
  const totalH = entries.reduce((s, e) => s + calcHours(e.start, e.end), 0);
  const isDayOff = !!dayData.off;

  const modalHoliday = HOLIDAYS[modalKey];
  let html = `
    <div class="modal-header">
      <span class="modal-title">יום ${DAYS_HE[dow]}, ${d} ${MONTHS_HE[mo-1]}${modalHoliday ? ` - ${modalHoliday}` : ''}</span>
      <button class="modal-close" onclick="closeDayModal()">&times;</button>
    </div>
  `;

  if (entries.length > 0 && !isDayOff) {
    html += '<div class="entries-in-day">';
    entries.forEach(e => {
      const h = calcHours(e.start, e.end);
      const locTag = e.loc === 'home' ? '<span class="entry-loc home">בית</span>' : '<span class="entry-loc office">משרד</span>';
      const isEditing = editingEntry && editingEntry.key === modalKey && editingEntry.id === e.id;
      if (isEditing) {
        html += `<div class="entry-edit-form">
          <div class="time-row">
            <div class="time-input-wrap"><span>התחלה</span><input type="time" id="edit-start-${e.id}"></div>
            <div class="time-input-wrap"><span>סיום</span><input type="time" id="edit-end-${e.id}"></div>
          </div>
          <div class="loc-selector">
            <span class="loc-label">מיקום:</span>
            <button class="loc-btn edit-loc-btn ${e.loc !== 'home' ? 'active' : ''}" data-eid="${e.id}" data-loc="office" onclick="pickEditLoc(${e.id},'office')">משרד</button>
            <button class="loc-btn edit-loc-btn ${e.loc === 'home' ? 'active' : ''}" data-eid="${e.id}" data-loc="home" onclick="pickEditLoc(${e.id},'home')">בית</button>
          </div>
          <div class="edit-actions">
            <button class="save-entry-btn" onclick="saveEditEntry('${modalKey}',${e.id})">שמור</button>
            <button class="cancel-edit-btn" onclick="cancelEditEntry()">ביטול</button>
          </div>
        </div>`;
      } else {
        html += `<div class="entry-row">
          <div class="entry-times">
            <span>${e.start}</span>
            <span class="arrow">&#8592;</span>
            <span>${e.end}</span>
          </div>
          ${locTag}
          <div class="entry-hours">${fmtH(h)}</div>
          <button class="entry-edit-icon" onclick="editEntry('${modalKey}',${e.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          </button>
          <button class="entry-del" onclick="deleteEntry('${modalKey}',${e.id})">&#10005;</button>
        </div>`;
      }
    });
    html += '</div>';
    html += `<div class="modal-total">סה"כ: ${fmtHLabel(totalH)}</div>`;
  }

  if (!isDayOff) {
    if (entries.length === 0 || addingEntry === modalKey) {
      html += `
        <div class="time-row">
          <div class="time-input-wrap"><span>התחלה</span><input type="time" id="start-${modalKey}"></div>
          <div class="time-input-wrap"><span>סיום</span><input type="time" id="end-${modalKey}"></div>
        </div>
        <div class="loc-selector">
          <span class="loc-label">מיקום:</span>
          <button class="loc-btn" id="loc-office-${modalKey}" onclick="pickLoc('${modalKey}','office')">משרד</button>
          <button class="loc-btn active" id="loc-home-${modalKey}" onclick="pickLoc('${modalKey}','home')">בית</button>
        </div>
        <button class="save-entry-btn" onclick="addEntry('${modalKey}')">שמור</button>
      `;
    } else {
      html += `<button class="add-entry-btn" onclick="startAddEntry('${modalKey}')">+ הוסף שעות</button>`;
    }
  }

  html += `
    <div class="off-selector">
      <button class="off-btn ${dayData.off === 'vacation' ? 'active' : ''}" onclick="setDayOff('${modalKey}','vacation')">חופש</button>
      <button class="off-btn ${dayData.off === 'sick' ? 'active' : ''}" onclick="setDayOff('${modalKey}','sick')">מחלה</button>
      ${dayData.off ? `<button class="off-btn clear" onclick="setDayOff('${modalKey}','${dayData.off}')">ביטול</button>` : ''}
    </div>
    <label class="toggle-pill travel-pill">
      <span class="pill-text">נסיעות</span>
      <div class="toggle-mini">
        <input type="checkbox" id="travel-${modalKey}" ${dayData.travel ? 'checked' : ''} onchange="saveToggle('${modalKey}','travel')">
        <span class="slider"></span>
      </div>
    </label>
  `;

  document.getElementById('modalContent').innerHTML = html;
}

function renderDashboard() {
  const m = dashMonth.getMonth();
  const y = dashMonth.getFullYear();
  document.getElementById('dashMonthDisplay').textContent = MONTHS_HE[m] + ' ' + y;

  const daysInMonth = new Date(y, m+1, 0).getDate();
  let totalHours = 0, workDays = 0, homeDays = 0, officeDays = 0, hybridDays = 0;
  let travelDays = 0, vacationDays = 0, sickDays = 0;
  let maxDay = 0, maxDayLabel = '';

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(y, m, d);
    const pd = getProjectData();
    const dayData = pd[key];
    if (!dayData) continue;
    if (dayData.off === 'vacation') { vacationDays++; continue; }
    if (dayData.off === 'sick') { sickDays++; continue; }
    if (!dayData.entries || dayData.entries.length === 0) continue;
    const dayTotal = dayData.entries.reduce((s, e) => s + calcHours(e.start, e.end), 0);
    totalHours += dayTotal;
    workDays++;
    const hasHome = dayData.entries.some(e => e.loc === 'home');
    const hasOffice = dayData.entries.some(e => !e.loc || e.loc === 'office');
    if (hasHome && hasOffice) hybridDays++;
    else if (hasHome) homeDays++;
    else officeDays++;
    if (dayData.travel) travelDays++;
    if (dayTotal > maxDay) {
      maxDay = dayTotal;
      const dt = new Date(y, m, d);
      maxDayLabel = `יום ${DAYS_HE[dt.getDay()]}, ${d}`;
    }
  }

  const avgHours = workDays > 0 ? totalHours / workDays : 0;
  const workingDaysInMonth = countWorkingDays(y, m);
  const allReportedDays = workDays + vacationDays + sickDays;
  const reportProgress = Math.min(100, Math.round((allReportedDays / workingDaysInMonth) * 100));

  document.getElementById('dashContent').innerHTML = `
    <div class="dash-section">
      <div class="dash-title">סיכום חודשי</div>
      <div class="stat-grid">
        <div class="stat-box wide accent">
          <div class="stat-val">${fmtHLabel(totalHours)}</div>
          <div class="stat-lbl">סה"כ שעות</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${workDays}</div>
          <div class="stat-lbl">ימי עבודה</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${fmtH(avgHours)}</div>
          <div class="stat-lbl">ממוצע יומי</div>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-title">התקדמות דיווח</div>
      <div class="progress-bar-wrap">
        <div class="progress-label">
          <span>ימים מדווחים</span>
          <span>${allReportedDays} / ${workingDaysInMonth}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${reportProgress}%"></div>
        </div>
      </div>
    </div>

    ${(vacationDays > 0 || sickDays > 0) ? `<div class="dash-section">
      <div class="dash-title">היעדרויות</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val">${vacationDays}</div>
          <div class="stat-lbl">ימי חופש</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${sickDays}</div>
          <div class="stat-lbl">ימי מחלה</div>
        </div>
      </div>
    </div>` : ''}

    <div class="dash-section">
      <div class="dash-title">פילוח מיקום</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val">${officeDays}</div>
          <div class="stat-lbl">משרד</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${homeDays}</div>
          <div class="stat-lbl">בית</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${hybridDays}</div>
          <div class="stat-lbl">משולב</div>
        </div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-title">נסיעות</div>
      <div class="stat-grid">
        <div class="stat-box wide">
          <div class="stat-val">${travelDays}</div>
          <div class="stat-lbl">ימי נסיעות בחודש</div>
        </div>
      </div>
    </div>

    ${maxDay > 0 ? `<div class="dash-section">
      <div class="dash-title">היום הארוך ביותר</div>
      <div class="stat-grid">
        <div class="stat-box wide">
          <div class="stat-val">${fmtHLabel(maxDay)}</div>
          <div class="stat-lbl">${maxDayLabel}</div>
        </div>
      </div>
    </div>` : ''}
  `;
}

function countWorkingDays(y, m) {
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let count = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(y, m, d).getDay();
    if (dow !== 5 && dow !== 6) count++;
  }
  return count;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

renderReport();
</script>
